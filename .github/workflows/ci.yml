name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: dull-ca
          authToken: ${{ secrets.DULL_CA_CACHIX_PRIVATE_KEY }}

      - run: nix flake check --print-build-logs

      - run: nix build .#container --print-build-logs

      # Covers what the sandboxed server-serves check cannot: that the image
      # boots as nobody with the entrypoint and env it was built with. The trap
      # is load-bearing -- Actions runs this under `bash -e`, so without it
      # `docker logs` never runs on failure.
      - name: Smoke test the image
        run: |
          docker load < result

          cleanup() {
            docker logs bc-smoke || true
            docker rm -f bc-smoke || true
          }
          trap cleanup EXIT

          docker run -d --name bc-smoke -p 8099:8000 bc:latest

          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/ && break
            sleep 1
          done
          root=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          ctype=$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8099/)
          bundle=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/client.mjs)
          ping=$(curl -s -X POST http://127.0.0.1:8099/ping)
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/definitely-not-here)
          test "$root" = 200 || { echo "FAIL root: $root"; exit 1; }
          test "$ctype" = "text/html; charset=utf-8" || { echo "FAIL ctype: $ctype"; exit 1; }
          test "$bundle" = 200 || { echo "FAIL bundle: $bundle"; exit 1; }
          test "$ping" = '{"ping":"pong"}' || { echo "FAIL ping: $ping"; exit 1; }
          test "$missing" = 404 || { echo "FAIL 404: $missing"; exit 1; }
          echo "smoke test passed"
