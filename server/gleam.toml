name = "server"
version = "1.0.0"

# No dependency on `client`: it serves whatever STATIC_DIRECTORY names. A
# dependency would compile the frontend for the BEAM and drag this package back
# to lustre_ui's stdlib 0.47 ceiling, and so off wisp 2.x.

[dependencies]
envoy = ">= 1.2.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
wisp = ">= 2.2.2 and < 3.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
