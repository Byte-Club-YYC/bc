name = "client"
target = "javascript"
version = "1.0.0"

# No lustre_dev_tools: `build app` downloads esbuild at build time, which a nix
# sandbox cannot do. See ci/build-client.sh.
#
# The ceilings below are a chain. lustre_ui 0.6.0 (newest non-prerelease) needs
# lustre ~> 4.0 and gleam_json ~> 1.0; gleam_json 1.x uses string_builder and
# dynamic.Decoder, both dropped in gleam_stdlib 0.48.0. Bisected: 0.47.0
# compiles, 0.48.0 does not. The server shares none of this.

[dependencies]
gleam_json = ">= 1.0.0 and < 2.0.0"
gleam_stdlib = ">= 0.34.0 and < 0.48.0"
lustre = ">= 4.1.0 and < 5.0.0"
lustre_http = ">= 0.5.0 and < 1.0.0"
lustre_ui = ">= 0.6.0 and < 1.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
